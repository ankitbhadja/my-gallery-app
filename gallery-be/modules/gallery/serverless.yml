service: my-custom-app
frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  region: "ap-south-1"
  memorySize: 256
  architecture: arm64
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "s3:GetObject"
            - "s3:PutObject"
            - "s3:DeleteObject"
            - "s3:ListBucket"
          Resource:
            - ${env:BUCKET_ARN}
            - ${env:BUCKET_ARN_WITH_STAR}
  runtime: nodejs22.x
  profile: ${env:PROFILE}
  timeout: 30
  logRetentionInDays: 14
  environment:
    BUCKET_NAME: ${env:BUCKET_NAME}
    CLOUD_FRONT_URL: ${env:CLOUD_FRONT_URL}
    CLOUDFRONT_KEY_PAIR_ID: ${env:CLOUDFRONT_KEY_PAIR_ID}
    CLOUDFRONT_PRIVATE_KEY: ${env:CLOUDFRONT_PRIVATE_KEY}
    JWT_SECRET: ${env:JWT_SECRET}
    GALLERY_ANKIT_PASSWORD: ${env:GALLERY_ANKIT_PASSWORD}
    GALLERY_GUEST_PASSWORD: ${env:GALLERY_GUEST_PASSWORD}

functions: ${file(gallery-functions.yml):functions}

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline
custom:
  serverless-offline:
    httpPort: 4000
